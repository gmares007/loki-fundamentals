version: '3'
services:
  fluentd:
    image: grafana/fluent-plugin-loki:main
    command:
      - "fluentd"
      - "-v"
      - "-p"
      - "/fluentd/plugins"
    environment:
      FLUENTD_CONF: fluentd.conf
    volumes:
      - ./fluentd.conf:/fluentd/etc/fluentd.conf
    depends_on:
      - loki
    networks:
      - loki
  fluent-bit:
    image: grafana/fluent-bit-plugin-loki:main
    command:
      - "-e"
      - "/fluent-bit/bin/out_grafana_loki.so"
      - --workdir=/fluent-bit/etc
      - --config=/fluent-bit/etc/conf/fluent-bit.conf
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/conf/fluent-bit.conf
      - ./logmap.json:/fluent-bit/etc/conf/logmap.json
    depends_on:
      - loki
    networks:
      - loki
  loki:
    image: grafana/loki:main
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - loki
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
    ports:
      - 3000:3000/tcp
    entrypoint:
       - sh
       - -euc
       - |
         mkdir -p /etc/grafana/provisioning/datasources
         cat <<EOF > /etc/grafana/provisioning/datasources/ds.yaml
         apiVersion: 1
         datasources:
         - name: Loki
           type: loki
           access: proxy
           orgId: 1
           url: http://loki:3100
           basicAuth: false
           isDefault: false
           version: 1
           editable: false
         EOF
         /run.sh
    networks:
      - loki
    
networks:
    loki:

    


    